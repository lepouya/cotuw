<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Citadels of the Unquiet World</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body class="at-title">
    <main class="game-shell">
      <aside
        id="game-sidebar"
        class="game-sidebar"
        aria-label="Command sidebar"
      ></aside>
      <div class="game-viewport">
        <header id="top-bar" class="top-bar" aria-label="Mission status">
          <div class="top-bar-group">
            <button
              id="open-menu"
              type="button"
              title="Game menu (Escape / F10)"
            >
              Menu
            </button>
            <div class="time-controls" role="group" aria-label="Game speed">
              <button id="pause-mission" type="button" aria-pressed="false">
                ⏸ Pause
              </button>
              <button
                type="button"
                data-speed="0.5"
                aria-pressed="false"
                aria-label="Half speed"
              >
                ½×
              </button>
              <button
                type="button"
                data-speed="1"
                aria-pressed="true"
                aria-label="Normal speed"
              >
                1×
              </button>
              <button
                type="button"
                data-speed="2"
                aria-pressed="false"
                aria-label="Double speed"
              >
                2×
              </button>
              <button
                type="button"
                data-speed="4"
                aria-pressed="false"
                aria-label="Quadruple speed"
              >
                4×
              </button>
            </div>
          </div>
          <button
            id="objective-summary"
            class="objective-summary"
            type="button"
            hidden
          >
            <span aria-hidden="true">◎</span>
            <span id="objective-text" class="objective-text"></span>
          </button>
          <div class="top-bar-group">
            <span
              id="resource-bar"
              class="resource-bar"
              role="group"
              title="Materials"
              hidden
              ><span class="resource-name">Materials</span
              ><span class="resource-symbol" aria-hidden="true">◆</span>
              <strong id="materials-counter">0</strong></span
            >
            <span
              id="mission-time"
              class="mission-time"
              role="timer"
              title="Elapsed mission time"
              >0:00</span
            >
            <button
              id="alert-toggle"
              type="button"
              aria-expanded="false"
              aria-controls="alert-history-panel"
            >
              ⚠ <span id="alert-unread" class="alert-unread"></span>
            </button>
          </div>
        </header>
        <div class="world-view">
          <section
            id="alert-history-panel"
            class="alert-history"
            aria-label="Alert history"
            hidden
          >
            <h2>Alerts</h2>
            <ol id="alert-history"></ol>
          </section>
          <div
            id="notifications"
            class="notifications"
            role="status"
            aria-live="polite"
          ></div>
          <canvas
            id="game-canvas"
            aria-label="Game world"
            tabindex="0"
          ></canvas>
          <div
            id="camera-controls"
            class="camera-controls"
            role="group"
            aria-label="Camera controls"
          >
            <button
              type="button"
              data-camera-action="rotate-left"
              aria-label="Rotate camera left"
            >
              ↶
            </button>
            <button
              type="button"
              data-camera-action="up"
              aria-label="Pan camera up"
            >
              ↑
            </button>
            <button
              type="button"
              data-camera-action="rotate-right"
              aria-label="Rotate camera right"
            >
              ↷
            </button>
            <button
              type="button"
              data-camera-action="left"
              aria-label="Pan camera left"
            >
              ←
            </button>
            <button
              type="button"
              data-camera-action="views"
              aria-label="Camera views"
              aria-expanded="false"
              aria-controls="camera-views"
            >
              View
            </button>
            <button
              type="button"
              data-camera-action="right"
              aria-label="Pan camera right"
            >
              →
            </button>
            <button
              type="button"
              data-camera-action="zoom-in"
              aria-label="Zoom camera in"
            >
              +
            </button>
            <button
              type="button"
              data-camera-action="down"
              aria-label="Pan camera down"
            >
              ↓
            </button>
            <button
              type="button"
              data-camera-action="zoom-out"
              aria-label="Zoom camera out"
            >
              −
            </button>
            <button
              type="button"
              data-camera-action="tilt-up"
              aria-label="Tilt camera up"
            >
              Tilt ↑
            </button>
            <button
              type="button"
              data-camera-action="tilt-down"
              aria-label="Tilt camera down"
            >
              Tilt ↓
            </button>
            <button
              type="button"
              data-camera-action="pan"
              aria-label="Pan mode"
              aria-pressed="false"
              title="Pan mode: drag with one finger or scroll. Turn off to select and command units."
            >
              Pan
            </button>
            <div
              id="camera-views"
              class="camera-views"
              data-world-input-blocking
              role="group"
              aria-label="Camera views"
              hidden
            >
              <button
                type="button"
                data-camera-view="isometric"
                aria-pressed="false"
              >
                Isometric
              </button>
              <button
                type="button"
                data-camera-view="top-down"
                aria-pressed="false"
              >
                Top-down
              </button>
              <button
                type="button"
                data-camera-view="grid"
                aria-pressed="false"
              >
                Grid
              </button>
              <button
                type="button"
                data-camera-view="reset"
                aria-label="Reset camera view"
              >
                Reset
              </button>
            </div>
            <label class="edge-pan-control">
              <input id="edge-panning" type="checkbox" checked /> Edge panning
            </label>
          </div>
          <canvas
            id="minimap"
            class="minimap"
            aria-label="Map overview"
          ></canvas>
        </div>
      </div>
    </main>
    <div id="game-dialogs"></div>
  </body>
</html>
