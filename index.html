<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Citadels of the Unquiet World</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body class="at-title">
    <main class="game-shell">
      <aside
        id="game-sidebar"
        class="game-sidebar"
        aria-label="Command sidebar"
      ></aside>
      <div class="game-viewport">
        <header
          id="top-bar"
          class="top-bar"
          aria-label="Mission status"
        ></header>
        <div class="world-view">
          <div id="mission-alerts" class="mission-alerts"></div>
          <canvas
            id="game-canvas"
            aria-label="Game world"
            tabindex="0"
          ></canvas>
          <div
            id="camera-controls"
            class="camera-controls"
            role="group"
            aria-label="Camera controls"
          ></div>
          <canvas
            id="minimap"
            class="minimap"
            aria-label="Map overview"
          ></canvas>
        </div>
      </div>
    </main>
    <div id="game-dialogs"></div>
  </body>
</html>
