<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Citadels of the Unquiet World</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body class="at-title">
    <main class="game-shell">
      <aside
        id="game-sidebar"
        class="game-sidebar"
        aria-label="Command sidebar"
      >
        <header class="sidebar-header">
          <p id="faction-label" class="eyebrow"></p>
          <h1>Unquiet World</h1>
          <p class="muted">
            <span id="scenario-label"></span>
          </p>
          <button id="tab-goals" type="button" aria-controls="panel-goals">
            Goals
          </button>
        </header>
        <div class="production-pane">
          <div class="sidebar-tabs" role="tablist" aria-label="Command panels">
            <button
              id="tab-buildings"
              type="button"
              role="tab"
              aria-controls="panel-buildings"
              aria-selected="true"
            >
              Buildings
            </button>
            <button
              id="tab-units"
              type="button"
              role="tab"
              aria-controls="panel-units"
              aria-selected="false"
              tabindex="-1"
            >
              Units
            </button>
          </div>
          <div class="sidebar-content">
            <section
              id="panel-buildings"
              role="tabpanel"
              aria-labelledby="tab-buildings"
            >
              <p id="construction-instructions" class="muted"></p>
              <div id="building-options" class="production-grid"></div>
              <div
                id="construction-queue"
                class="actor-list"
                aria-label="Paid building construction"
              ></div>
            </section>
            <section
              id="panel-units"
              role="tabpanel"
              aria-labelledby="tab-units"
              hidden
            >
              <div
                id="training-options"
                class="production-grid"
                role="group"
                aria-label="Unit training"
              ></div>
              <p id="production-status" class="muted" role="status"></p>
              <details id="economy-overview" hidden open>
                <summary>Resource sites &amp; salvage</summary>
                <p id="economy-alert" class="muted" role="status"></p>
                <div id="resource-overview" class="actor-list"></div>
              </details>
              <details class="roster-disclosure" open>
                <summary>Field units</summary>
                <div
                  id="unit-roster"
                  class="actor-list"
                  aria-label="Field units"
                ></div>
              </details>
            </section>
            <section
              id="panel-goals"
              role="region"
              aria-labelledby="tab-goals"
              hidden
            >
              <p class="eyebrow">Scenario goals</p>
              <h2 id="scenario-title"></h2>
              <p class="muted"><span id="scenario-description"></span></p>
              <p id="mission-directive" class="muted" role="status" hidden></p>
              <ul id="mission-objectives" class="scenario-goals" hidden></ul>
              <h3 id="preparation-heading"></h3>
              <ul id="scenario-goals" class="scenario-goals"></ul>
              <p id="scenario-goals-note" class="muted"></p>
              <p id="scenario-rules" class="muted"></p>
              <label id="network-view-control" class="animation-control" hidden
                ><input id="network-view" type="checkbox" /> Network View</label
              >
              <label class="animation-control"
                ><input id="animate-building" type="checkbox" checked />
                Building idle animation</label
              >
            </section>
          </div>
        </div>
        <div class="selection-pane">
          <section id="panel-selection" aria-label="Current selection">
            <p id="selection-heading" class="eyebrow">Current selection</p>
            <h2 id="selection-details">Nothing selected</h2>
            <p id="selection-health" hidden></p>
            <p data-network-status class="muted" hidden></p>
            <p id="selection-info" class="muted"></p>
            <p id="construction-details" class="muted" hidden></p>
            <section
              id="harvester-actions"
              hidden
              aria-label="Harvesting controls"
            >
              <h3 id="worker-activity-heading">Materials gathering</h3>
              <p id="harvester-details" class="muted"></p>
              <div id="gather-sites" class="actor-list"></div>
              <h3 id="refinery-assignment-heading">Assigned Refinery</h3>
              <div id="refinery-assignments" class="actor-list"></div>
              <div id="return-cargo-actions" class="actor-list"></div>
              <p id="harvester-status" class="muted" role="status"></p>
            </section>
            <section data-rally-controls hidden aria-label="Rally point">
              <button type="button" data-rally-action="set">
                Set Rally Point
              </button>
              <button type="button" data-rally-action="clear">
                Clear Rally Point
              </button>
              <button type="button" data-rally-action="cancel" hidden>
                Cancel rally point
              </button>
              <p data-rally-status class="muted" role="status"></p>
            </section>
            <div
              id="production-queue"
              class="actor-list"
              aria-label="Paid production orders"
            ></div>
            <button id="open-training" type="button" hidden>Train units</button>
            <button id="remove-building" type="button" disabled>
              Remove selected building
            </button>
          </section>
        </div>
        <section
          id="placement-panel"
          class="placement-panel"
          aria-label="Building placement"
          hidden
        >
          <div
            id="placement-actions"
            class="building-controls"
            hidden
            role="group"
            aria-label="Placement actions"
          >
            <button id="rotate-building" type="button" disabled>
              Rotate 90° (R)
            </button>
            <button id="confirm-building" type="button" disabled>
              Place building
            </button>
            <button id="cancel-building" type="button" disabled>
              Cancel (Esc)
            </button>
          </div>
          <p id="placement-status" class="muted" role="status"></p>
        </section>
        <section class="unit-controls" aria-label="Unit controls">
          <div
            class="building-controls"
            role="group"
            aria-label="Selection and movement"
          >
            <button id="box-select" type="button" aria-pressed="false">
              Box select
            </button>
            <button id="add-selection" type="button" aria-pressed="false">
              Add units
            </button>
            <button id="queue-orders" type="button" aria-pressed="false">
              ⋯ Queue orders
            </button>
            <button id="attack-move" type="button" aria-pressed="false" hidden>
              ⚔ Attack Move
            </button>
            <button id="cancel-attack-move" type="button" hidden>
              Cancel Attack Move
            </button>
            <button id="stop-units" type="button" disabled>Stop (S)</button>
            <button id="clear-selection" type="button" disabled>Clear</button>
            <button id="focus-selection" type="button" disabled>⌖ Focus</button>
            <button
              id="follow-selection"
              type="button"
              aria-pressed="false"
              disabled
            >
              ⤳ Follow
            </button>
          </div>
          <p id="movement-status" class="muted" role="status"></p>
        </section>
      </aside>
      <div class="game-viewport">
        <header id="top-bar" class="top-bar" aria-label="Mission status">
          <div class="top-bar-group">
            <button
              id="open-menu"
              type="button"
              title="Game menu (Escape / F10)"
            >
              Menu
            </button>
            <div class="time-controls" role="group" aria-label="Game speed">
              <button id="pause-mission" type="button" aria-pressed="false">
                ⏸ Pause
              </button>
              <button
                type="button"
                data-speed="0.5"
                aria-pressed="false"
                aria-label="Half speed"
              >
                ½×
              </button>
              <button
                type="button"
                data-speed="1"
                aria-pressed="true"
                aria-label="Normal speed"
              >
                1×
              </button>
              <button
                type="button"
                data-speed="2"
                aria-pressed="false"
                aria-label="Double speed"
              >
                2×
              </button>
              <button
                type="button"
                data-speed="4"
                aria-pressed="false"
                aria-label="Quadruple speed"
              >
                4×
              </button>
            </div>
          </div>
          <button
            id="objective-summary"
            class="objective-summary"
            type="button"
            hidden
          >
            <span aria-hidden="true">◎</span>
            <span id="objective-text" class="objective-text"></span>
          </button>
          <div class="top-bar-group">
            <span
              id="resource-bar"
              class="resource-bar"
              role="group"
              title="Materials"
              hidden
              ><span class="resource-name">Materials</span
              ><span class="resource-symbol" aria-hidden="true">◆</span>
              <strong id="materials-counter">0</strong></span
            >
            <span
              id="mission-time"
              class="mission-time"
              role="timer"
              title="Elapsed mission time"
              >0:00</span
            >
            <button
              id="alert-toggle"
              type="button"
              aria-expanded="false"
              aria-controls="alert-history-panel"
            >
              ⚠ <span id="alert-unread" class="alert-unread"></span>
            </button>
          </div>
        </header>
        <div class="world-view">
          <section
            id="alert-history-panel"
            class="alert-history"
            aria-label="Alert history"
            hidden
          >
            <h2>Alerts</h2>
            <ol id="alert-history"></ol>
          </section>
          <div
            id="notifications"
            class="notifications"
            role="status"
            aria-live="polite"
          ></div>
          <canvas
            id="game-canvas"
            aria-label="Game world"
            tabindex="0"
          ></canvas>
          <div
            id="camera-controls"
            class="camera-controls"
            role="group"
            aria-label="Camera controls"
          >
            <button
              type="button"
              data-camera-action="rotate-left"
              aria-label="Rotate camera left"
            >
              ↶
            </button>
            <button
              type="button"
              data-camera-action="up"
              aria-label="Pan camera up"
            >
              ↑
            </button>
            <button
              type="button"
              data-camera-action="rotate-right"
              aria-label="Rotate camera right"
            >
              ↷
            </button>
            <button
              type="button"
              data-camera-action="left"
              aria-label="Pan camera left"
            >
              ←
            </button>
            <button
              type="button"
              data-camera-action="views"
              aria-label="Camera views"
              aria-expanded="false"
              aria-controls="camera-views"
            >
              View
            </button>
            <button
              type="button"
              data-camera-action="right"
              aria-label="Pan camera right"
            >
              →
            </button>
            <button
              type="button"
              data-camera-action="zoom-in"
              aria-label="Zoom camera in"
            >
              +
            </button>
            <button
              type="button"
              data-camera-action="down"
              aria-label="Pan camera down"
            >
              ↓
            </button>
            <button
              type="button"
              data-camera-action="zoom-out"
              aria-label="Zoom camera out"
            >
              −
            </button>
            <button
              type="button"
              data-camera-action="tilt-up"
              aria-label="Tilt camera up"
            >
              Tilt ↑
            </button>
            <button
              type="button"
              data-camera-action="tilt-down"
              aria-label="Tilt camera down"
            >
              Tilt ↓
            </button>
            <button
              type="button"
              data-camera-action="pan"
              aria-label="Pan mode"
              aria-pressed="false"
              title="Pan mode: drag with one finger or scroll. Turn off to select and command units."
            >
              Pan
            </button>
            <div
              id="camera-views"
              class="camera-views"
              data-world-input-blocking
              role="group"
              aria-label="Camera views"
              hidden
            >
              <button
                type="button"
                data-camera-view="isometric"
                aria-pressed="false"
              >
                Isometric
              </button>
              <button
                type="button"
                data-camera-view="top-down"
                aria-pressed="false"
              >
                Top-down
              </button>
              <button
                type="button"
                data-camera-view="grid"
                aria-pressed="false"
              >
                Grid
              </button>
              <button
                type="button"
                data-camera-view="reset"
                aria-label="Reset camera view"
              >
                Reset
              </button>
            </div>
            <label class="edge-pan-control">
              <input id="edge-panning" type="checkbox" checked /> Edge panning
            </label>
          </div>
          <canvas
            id="minimap"
            class="minimap"
            aria-label="Map overview"
          ></canvas>
        </div>
      </div>
    </main>
    <div id="game-dialogs"></div>
  </body>
</html>
