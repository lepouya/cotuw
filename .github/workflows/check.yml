name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Browser tests need a GPU. Software WebGL on the Windows and Linux
      # runners is too slow for them, so only macOS runs the full check.
      - if: runner.os == 'macOS'
        run: npx playwright install chromium webkit
      - if: runner.os == 'macOS'
        run: npm run check
      - if: runner.os != 'macOS'
        run: npm run format:check && npm run lint && npm run typecheck && npm run test:ts && npm run test:rs
      - if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          if-no-files-found: ignore

  # Desktop packaging is Windows and macOS first, but the core stays
  # browser-runnable, so Linux checks the web code without the Tauri crate.
  web:
    name: ubuntu-latest (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run format:check:ts
      - run: npm run lint:ts
      - run: npm run typecheck:ts
      - run: npm run test:ts
