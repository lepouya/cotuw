<button
  type="button"
  data-camera-action="rotate-left"
  aria-label="Rotate camera left"
>
  ↶
</button>
<button type="button" data-camera-action="up" aria-label="Pan camera up">
  ↑
</button>
<button
  type="button"
  data-camera-action="rotate-right"
  aria-label="Rotate camera right"
>
  ↷
</button>
<button type="button" data-camera-action="left" aria-label="Pan camera left">
  ←
</button>
<button
  type="button"
  data-camera-action="views"
  aria-label="Camera views"
  aria-expanded="false"
  aria-controls="camera-views"
>
  View
</button>
<button type="button" data-camera-action="right" aria-label="Pan camera right">
  →
</button>
<button type="button" data-camera-action="zoom-in" aria-label="Zoom camera in">
  +
</button>
<button type="button" data-camera-action="down" aria-label="Pan camera down">
  ↓
</button>
<button
  type="button"
  data-camera-action="zoom-out"
  aria-label="Zoom camera out"
>
  −
</button>
<button type="button" data-camera-action="tilt-up" aria-label="Tilt camera up">
  Tilt ↑
</button>
<button
  type="button"
  data-camera-action="tilt-down"
  aria-label="Tilt camera down"
>
  Tilt ↓
</button>
<button
  type="button"
  data-camera-action="pan"
  aria-label="Pan mode"
  aria-pressed="false"
  title="Pan mode: drag with one finger or scroll. Turn off to select and command units."
>
  Pan
</button>
<div
  id="camera-views"
  class="camera-views"
  data-world-input-blocking
  role="group"
  aria-label="Camera views"
  hidden
>
  <button type="button" data-camera-view="isometric" aria-pressed="false">
    Isometric
  </button>
  <button type="button" data-camera-view="top-down" aria-pressed="false">
    Top-down
  </button>
  <button type="button" data-camera-view="grid" aria-pressed="false">
    Grid
  </button>
  <button type="button" data-camera-view="reset" aria-label="Reset camera view">
    Reset
  </button>
</div>
<label class="edge-pan-control">
  <input id="edge-panning" type="checkbox" checked /> Edge panning
</label>
