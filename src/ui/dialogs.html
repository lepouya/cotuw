<dialog id="explanation" aria-labelledby="explanation-title">
  <p class="eyebrow">Field guide</p>
  <h2 id="explanation-title"></h2>
  <p id="explanation-text"></p>
  <p class="muted">The mission is paused.</p>
  <button id="dismiss-explanation" type="button">Continue</button>
</dialog>
<dialog id="game-menu" aria-labelledby="game-menu-title">
  <h2 id="game-menu-title">Paused</h2>
  <p id="game-menu-description"></p>
  <section id="options-panel" hidden aria-label="Options">
    <div id="menu-audio"></div>
    <button id="cancel-options" type="button">Back</button>
  </section>
  <div id="game-menu-actions" class="action-row">
    <button id="new-mission" class="primary-action" type="button" hidden>
      New mission
    </button>
    <button id="resume-mission" type="button" hidden>Resume</button>
    <button id="inspect-loaded-mission" type="button" hidden>Inspect</button>
    <button id="save-mission" type="button">Save</button>
    <button id="quicksave-mission" type="button" data-panel-work>
      Quicksave
    </button>
    <button id="load-mission" type="button">Load</button>
    <button id="open-options" type="button" hidden>Options</button>
    <button id="restart-mission" type="button">Restart</button>
    <button id="exit-mission" type="button">Main menu</button>
    <button id="quit-game" type="button" hidden>Exit</button>
    <button id="return-to-title" type="button" hidden>
      Return to main menu
    </button>
  </div>
  <div id="setup-panel"></div>
  <div id="save-panels"></div>
  <p id="game-menu-status" class="muted" role="status"></p>
  <p id="game-version" class="eyebrow" hidden></p>
</dialog>
