<fieldset
  id="audio-controls"
  class="audio-controls"
  aria-label="Audio controls"
>
  <legend>Audio</legend>
  <label for="audio-master-volume">Master volume</label>
  <input id="audio-master-volume" type="range" min="0" max="100" />
  <button id="audio-master-mute" type="button"></button>
  <label for="audio-sound-volume">Sound volume</label>
  <input id="audio-sound-volume" type="range" min="0" max="100" />
  <button id="audio-sound-mute" type="button"></button>
  <label for="audio-music-volume">Music volume</label>
  <input id="audio-music-volume" type="range" min="0" max="100" />
  <button id="audio-music-mute" type="button"></button>
  <p id="audio-status" role="status"></p>
</fieldset>
