<form id="save-form" class="save-form" hidden>
  <label for="save-name">Save name</label>
  <input id="save-name" type="text" maxlength="80" required data-panel-work />
  <div class="action-row">
    <button id="confirm-save" type="submit" data-panel-work data-requires-save>
      Save
    </button>
    <button
      id="export-mission"
      type="button"
      data-panel-work
      data-requires-save
    >
      Export file
    </button>
    <button id="cancel-save" type="button">Back</button>
  </div>
</form>
<section id="load-panel" hidden aria-label="Saved missions">
  <ul id="save-entries" class="save-entries"></ul>
  <div class="action-row">
    <button id="import-mission" type="button" data-panel-work>
      Import file
    </button>
    <button id="cancel-load" type="button">Back</button>
  </div>
</section>
