<section id="mission-setup" hidden aria-label="Set up your mission">
  <fieldset id="difficulty-choices" class="setup-choices difficulty-choices">
    <legend>Difficulty</legend>
  </fieldset>
  <div class="setup-choices faction-choices">
    <button id="choose-arc" class="setup-choice" type="button">
      <strong>Anomaly Response Command</strong>
      <span
        >Establish a base, gather Materials, and train a force to clear the wolf
        den.</span
      >
    </button>
    <button id="choose-circle" class="setup-choice" type="button">
      <strong>Circle of Repose</strong>
      <span>Grow a living base, cultivate Lifebloom, and raise an army.</span>
    </button>
  </div>
  <button id="cancel-mission-setup" type="button">Back</button>
</section>
